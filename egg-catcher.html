<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>سلة البيض | خالد البيك</title>
<meta name="description" content="سلة البيض - لعبة مجانية تلعب مباشرة من المتصفح">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#827717;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px}
h1{font-size:20px;margin:4px 0}
#bar{display:flex;justify-content:space-between;width:100%;font-size:16px;padding:2px 8px;font-weight:bold}
#stage{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;background:rgba(0,0,0,.25);border-radius:12px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;z-index:5}
#ov h2{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0 14px;font-size:16px;line-height:1.5}
button.b{background:#ffcc00;color:#222;border:0;border-radius:24px;padding:12px 32px;font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit}
button.b:active{transform:scale(.95)}
footer{font-size:11px;opacity:.7;padding:4px}
</style></head><body><div id="app">
<h1>🥚 سلة البيض</h1>
<div id="bar"><span id="sc">النقاط: 0</span><span id="lv"></span><span id="bs"></span></div><div id="stage"><canvas id="c" width="360" height="540"></canvas><div id="ov"></div></div>
<footer>© 2026 خالد البيك. جميع الحقوق محفوظة.</footer></div>
<script>
var CFG={"id": "egg-catcher", "title": "سلة البيض", "emoji": "🥚", "desc": "التقط البيض بدون أن يسقط", "player": "🧺", "good": ["🥚", "🐣"], "bad": ["💩", "🪨"], "bg": "#827717", "badRate": 0.25, "help": "حرّك السلة لالتقاط الأشياء الجيدة وتجنب الأشياء الخاطئة."};
var BEST=+(localStorage.getItem('best_'+CFG.id)||0);
function saveBest(s){if(s>BEST){BEST=s;try{localStorage.setItem('best_'+CFG.id,s)}catch(e){}}}
function overlay(t,p,btn,cb){var o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<h2>'+t+'</h2><p>'+p+'</p><button class="b" id="go">'+btn+'</button>';document.getElementById('go').onclick=function(){o.style.display='none';cb()}}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=540;
var px=W/2,tx=W/2,items=[],score=0,lives=3,run=false,last=0,t=0;
document.getElementById('bs').textContent='الأفضل: '+BEST;
function mv(e){var r=cv.getBoundingClientRect();var cx=(e.touches?e.touches[0].clientX:e.clientX);tx=(cx-r.left)/r.width*W}
cv.addEventListener('mousemove',mv);cv.addEventListener('touchmove',function(e){e.preventDefault();mv(e)},{passive:false});cv.addEventListener('touchstart',mv);
var keys={};document.addEventListener('keydown',function(e){keys[e.key]=1});document.addEventListener('keyup',function(e){keys[e.key]=0});
function start(){items=[];score=0;lives=3;px=tx=W/2;run=true;last=performance.now();requestAnimationFrame(loop)}
function loop(n){if(!run)return;var dt=Math.min(40,n-last)/16;last=n;t+=dt;
 if(keys.ArrowLeft)tx-=8*dt;if(keys.ArrowRight)tx+=8*dt;tx=Math.max(30,Math.min(W-30,tx));px+=(tx-px)*Math.min(1,.35*dt);
 var lvl=1+score/150;if(Math.random()<(.025+lvl*.004)*dt){var bad=Math.random()<CFG.badRate;items.push({x:rnd(20,W-20),y:-20,v:rnd(1.5,2.4)+lvl*.3,e:bad?pick(CFG.bad):pick(CFG.good),bad:bad})}
 for(var i=items.length-1;i>=0;i--){var a=items[i];a.y+=a.v*dt;
  if(a.y>H-70&&a.y<H-20&&Math.abs(a.x-px)<38){items.splice(i,1);if(a.bad){lives--;if(lives<=0)return over()}else score+=10;continue}
  if(a.y>H+20){items.splice(i,1);if(!a.bad){lives--;if(lives<=0)return over()}}}
 x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';x.font='44px serif';x.fillText(CFG.player,px,H-45);x.font='32px serif';
 for(var i=0;i<items.length;i++)x.fillText(items[i].e,items[i].x,items[i].y);
 document.getElementById('sc').textContent='النقاط: '+score;document.getElementById('lv').textContent='❤️'.repeat(lives);requestAnimationFrame(loop)}
function over(){run=false;saveBest(score);document.getElementById('bs').textContent='الأفضل: '+BEST;overlay('انتهت اللعبة','نقاطك: '+score+'<br>الأفضل: '+BEST,'العب مرة أخرى',start)}
overlay(CFG.title,CFG.help,'ابدأ',start);

</script></body></html>
