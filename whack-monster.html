<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>اطرد الوحوش | خالد البيك</title>
<meta name="description" content="اطرد الوحوش - لعبة مجانية تلعب مباشرة من المتصفح">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#311b92;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px}
h1{font-size:20px;margin:4px 0}
#bar{display:flex;justify-content:space-between;width:100%;font-size:16px;padding:2px 8px;font-weight:bold}
#stage{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;background:rgba(0,0,0,.25);border-radius:12px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;z-index:5}
#ov h2{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0 14px;font-size:16px;line-height:1.5}
button.b{background:#ffcc00;color:#222;border:0;border-radius:24px;padding:12px 32px;font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit}
button.b:active{transform:scale(.95)}
footer{font-size:11px;opacity:.7;padding:4px}
</style></head><body><div id="app">
<h1>👾 اطرد الوحوش</h1>
<div id="bar"><span id="sc">النقاط: 0</span><span id="lv"></span><span id="bs"></span></div><div id="stage"><div id="ov"></div><div id="field" style="position:absolute;inset:0"></div></div>
<footer>© 2026 خالد البيك. جميع الحقوق محفوظة.</footer></div>
<script>
var CFG={"id": "whack-monster", "title": "اطرد الوحوش", "emoji": "👾", "desc": "اطرد الوحوش الصغيرة", "good": ["👾", "👹", "👻"], "bad": "🧙", "bg": "#311b92", "badRate": 0.2, "help": "اضغط على الشخصيات عندما تظهر. تجنب الشخصية الخاطئة!"};
var BEST=+(localStorage.getItem('best_'+CFG.id)||0);
function saveBest(s){if(s>BEST){BEST=s;try{localStorage.setItem('best_'+CFG.id,s)}catch(e){}}}
function overlay(t,p,btn,cb){var o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<h2>'+t+'</h2><p>'+p+'</p><button class="b" id="go">'+btn+'</button>';document.getElementById('go').onclick=function(){o.style.display='none';cb()}}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var f=document.getElementById('field'),score,time,tm,sp,holes=[],run=false;
document.getElementById('bs').textContent='الأفضل: '+BEST;
function upd(){document.getElementById('sc').textContent='النقاط: '+score;document.getElementById('lv').textContent='⏱ '+time}
f.style.cssText='position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;align-content:center';
for(var i=0;i<9;i++){var h=document.createElement('div');h.style.cssText='aspect-ratio:1;background:radial-gradient(circle at 50% 80%,#0007,#0003);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(16vw,70px);cursor:pointer;overflow:hidden';h.dataset.i=i;f.appendChild(h);holes.push(h);
 (function(h){var hit=function(e){e.preventDefault();if(!run||!h.up)return;h.up=0;score+=h.bad?-10:10;if(score<0)score=0;h.textContent=h.bad?'💥':'⭐';upd();setTimeout(function(){h.textContent=''},250)};h.addEventListener('mousedown',hit);h.addEventListener('touchstart',hit,{passive:false})})(h)}
function pop(){if(!run)return;var h=pick(holes);if(!h.up){h.up=1;h.bad=Math.random()<CFG.badRate;h.textContent=h.bad?CFG.bad:pick(CFG.good);setTimeout(function(){if(h.up){h.up=0;h.textContent=''}},Math.max(500,1000-score*2))}sp=setTimeout(pop,Math.max(300,700-score*2))}
function start(){score=0;time=30;run=true;holes.forEach(function(h){h.textContent='';h.up=0});upd();pop();tm=setInterval(function(){time--;upd();if(time<=0){clearInterval(tm);run=false;clearTimeout(sp);holes.forEach(function(h){h.textContent=''});saveBest(score);document.getElementById('bs').textContent='الأفضل: '+BEST;overlay('انتهى الوقت','نقاطك: '+score+'<br>الأفضل: '+BEST,'العب مرة أخرى',start)}},1000)}
overlay(CFG.title,CFG.help,'ابدأ',start);

</script></body></html>
