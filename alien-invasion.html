<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>غزو الفضائيين | خالد البيك</title>
<meta name="description" content="غزو الفضائيين - لعبة مجانية تلعب مباشرة من المتصفح">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1a0b33;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px}
h1{font-size:20px;margin:4px 0}
#bar{display:flex;justify-content:space-between;width:100%;font-size:16px;padding:2px 8px;font-weight:bold}
#stage{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;background:rgba(0,0,0,.25);border-radius:12px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;z-index:5}
#ov h2{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0 14px;font-size:16px;line-height:1.5}
button.b{background:#ffcc00;color:#222;border:0;border-radius:24px;padding:12px 32px;font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit}
button.b:active{transform:scale(.95)}
footer{font-size:11px;opacity:.7;padding:4px}
</style></head><body><div id="app">
<h1>👽 غزو الفضائيين</h1>
<div id="bar"><span id="sc">النقاط: 0</span><span id="lv"></span><span id="bs"></span></div><div id="stage"><canvas id="c" width="360" height="540"></canvas><div id="ov"></div></div>
<footer>© 2026 خالد البيك. جميع الحقوق محفوظة.</footer></div>
<script>
var CFG={"id": "alien-invasion", "title": "غزو الفضائيين", "emoji": "👽", "desc": "أوقف غزو الفضائيين للأرض", "player": "🛸", "enemies": [["👽", 1, 32], ["👾", 1, 30], ["🤖", 2, 36]], "bg": "#1a0b33", "bullet": "#69f0ae", "spark": "#ffc107", "rate": 14, "help": "حرّك إصبعك أو الماوس لتحريك المركبة. الإطلاق تلقائي. لا تدع الأعداء يصلون إليك!"};
var BEST=+(localStorage.getItem('best_'+CFG.id)||0);
function saveBest(s){if(s>BEST){BEST=s;try{localStorage.setItem('best_'+CFG.id,s)}catch(e){}}}
function overlay(t,p,btn,cb){var o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<h2>'+t+'</h2><p>'+p+'</p><button class="b" id="go">'+btn+'</button>';document.getElementById('go').onclick=function(){o.style.display='none';cb()}}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=540;
var px=W/2,bul=[],en=[],pt=[],score=0,lives=3,run=false,lvl=1,t=0,last=0,fire=0,tx=W/2;
document.getElementById('bs').textContent='الأفضل: '+BEST;
function mv(e){var r=cv.getBoundingClientRect();var cx=(e.touches?e.touches[0].clientX:e.clientX);tx=(cx-r.left)/r.width*W;}
cv.addEventListener('mousemove',mv);cv.addEventListener('touchmove',function(e){e.preventDefault();mv(e)},{passive:false});cv.addEventListener('touchstart',function(e){mv(e)});
var keys={};document.addEventListener('keydown',function(e){keys[e.key]=1});document.addEventListener('keyup',function(e){keys[e.key]=0});
function start(){bul=[];en=[];pt=[];score=0;lives=3;lvl=1;px=tx=W/2;run=true;last=performance.now();requestAnimationFrame(loop)}
function boom(a,b,col){for(var i=0;i<10;i++)pt.push({x:a,y:b,vx:rnd(-3,3),vy:rnd(-3,3),l:25,c:col})}
function loop(n){if(!run)return;var dt=Math.min(40,n-last)/16;last=n;t+=dt;
 if(keys.ArrowLeft)tx-=7*dt;if(keys.ArrowRight)tx+=7*dt;tx=Math.max(20,Math.min(W-20,tx));px+=(tx-px)*Math.min(1,.3*dt);
 fire-=dt;if(fire<=0){bul.push({x:px,y:H-70});if(lvl>=4){bul.push({x:px-12,y:H-60});bul.push({x:px+12,y:H-60})}fire=CFG.rate||14}
 if(Math.random()<(.02+lvl*.006)*dt){var e=pick(CFG.enemies);en.push({x:rnd(25,W-25),y:-30,v:rnd(.9,1.6)+lvl*.25,hp:e[1],e:e[0],mh:e[1],s:e[2]||32})}
 for(var i=bul.length-1;i>=0;i--){bul[i].y-=9*dt;if(bul[i].y<-10)bul.splice(i,1)}
 for(var i=en.length-1;i>=0;i--){var a=en[i];a.y+=a.v*dt;
  for(var j=bul.length-1;j>=0;j--){if(Math.abs(bul[j].x-a.x)<a.s*.6&&Math.abs(bul[j].y-a.y)<a.s*.6){bul.splice(j,1);a.hp--;boom(a.x,a.y,CFG.spark);if(a.hp<=0){score+=a.mh*10;boom(a.x,a.y,'#fff');en.splice(i,1);break}}}
  if(en[i]===a&&a.y>H-70&&Math.abs(a.x-px)<a.s*.7){en.splice(i,1);lives--;boom(px,H-50,'#f55');if(lives<=0)return over()}
  else if(en[i]===a&&a.y>H+20){en.splice(i,1);lives--;if(lives<=0)return over()}}
 lvl=1+Math.floor(score/200);
 for(var i=pt.length-1;i>=0;i--){var p=pt[i];p.x+=p.vx;p.y+=p.vy;if(--p.l<=0)pt.splice(i,1)}
 draw();requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.6)';for(var i=0;i<30;i++){x.fillRect((i*97)%W,((i*53)+t*(1+i%3))%H,2,2)}
 x.textAlign='center';x.textBaseline='middle';x.font='38px serif';x.fillText(CFG.player,px,H-45);
 x.fillStyle=CFG.bullet;for(var i=0;i<bul.length;i++){x.fillRect(bul[i].x-2,bul[i].y,4,12)}
 for(var i=0;i<en.length;i++){var a=en[i];x.font=a.s+'px serif';x.fillText(a.e,a.x,a.y)}
 for(var i=0;i<pt.length;i++){x.fillStyle=pt[i].c;x.fillRect(pt[i].x,pt[i].y,3,3)}
 document.getElementById('sc').textContent='النقاط: '+score;document.getElementById('lv').textContent='❤️'.repeat(lives)+' م'+lvl}
function over(){run=false;saveBest(score);document.getElementById('bs').textContent='الأفضل: '+BEST;overlay('انتهت اللعبة','نقاطك: '+score+'<br>الأفضل: '+BEST,'العب مرة أخرى',start)}
overlay(CFG.title,CFG.help,'ابدأ',start);draw();

</script></body></html>
