<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ثعبان الحلوى | خالد البيك</title>
<meta name="description" content="ثعبان الحلوى - لعبة مجانية تلعب مباشرة من المتصفح">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#880e4f;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px}
h1{font-size:20px;margin:4px 0}
#bar{display:flex;justify-content:space-between;width:100%;font-size:16px;padding:2px 8px;font-weight:bold}
#stage{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;background:rgba(0,0,0,.25);border-radius:12px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;z-index:5}
#ov h2{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0 14px;font-size:16px;line-height:1.5}
button.b{background:#ffcc00;color:#222;border:0;border-radius:24px;padding:12px 32px;font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit}
button.b:active{transform:scale(.95)}
footer{font-size:11px;opacity:.7;padding:4px}
</style></head><body><div id="app">
<h1>🍭 ثعبان الحلوى</h1>
<div id="bar"><span id="sc">النقاط: 0</span><span id="lv"></span><span id="bs"></span></div><div id="stage"><canvas id="c" width="360" height="540"></canvas><div id="ov"></div></div>
<footer>© 2026 خالد البيك. جميع الحقوق محفوظة.</footer></div>
<script>
var CFG={"id": "snake-candy", "title": "ثعبان الحلوى", "emoji": "🍭", "desc": "ثعبان وردي يأكل الحلوى", "food": ["🍭", "🍬", "🍩", "🧁"], "head": "#ff4081", "body": "#f48fb1", "bg": "#880e4f", "help": "اسحب بإصبعك أو استخدم الأسهم لتوجيه الثعبان وتناول الحلوى."};
var BEST=+(localStorage.getItem('best_'+CFG.id)||0);
function saveBest(s){if(s>BEST){BEST=s;try{localStorage.setItem('best_'+CFG.id,s)}catch(e){}}}
function overlay(t,p,btn,cb){var o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<h2>'+t+'</h2><p>'+p+'</p><button class="b" id="go">'+btn+'</button>';document.getElementById('go').onclick=function(){o.style.display='none';cb()}}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=540,G=18,cols=W/G,rows=H/G;
var sn,dir,nd,food,score,run=false,iv;
document.getElementById('bs').textContent='الأفضل: '+BEST;
function setd(d){if(d[0]!==-dir[0]||d[1]!==-dir[1])nd=d}
document.addEventListener('keydown',function(e){var m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();setd(m)}});
var sx,sy;cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))setd([dx>0?1:-1,0]);else setd([0,dy>0?1:-1])});
var md;cv.addEventListener('mousedown',function(e){md=[e.clientX,e.clientY]});cv.addEventListener('mouseup',function(e){if(!md)return;var dx=e.clientX-md[0],dy=e.clientY-md[1];if(Math.abs(dx)+Math.abs(dy)>10){if(Math.abs(dx)>Math.abs(dy))setd([dx>0?1:-1,0]);else setd([0,dy>0?1:-1])}});
function nf(){do{food={x:Math.floor(rnd(0,cols)),y:Math.floor(rnd(0,rows)),e:pick(CFG.food)}}while(sn.some(function(s){return s[0]==food.x&&s[1]==food.y}))}
function start(){sn=[[10,15],[9,15],[8,15]];dir=nd=[1,0];score=0;nf();run=true;clearInterval(iv);iv=setInterval(step,Math.max(60,130-score/3))}
function step(){dir=nd;var h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
 if(h[0]<0||h[1]<0||h[0]>=cols||h[1]>=rows||sn.some(function(s){return s[0]==h[0]&&s[1]==h[1]})){run=false;clearInterval(iv);saveBest(score);document.getElementById('bs').textContent='الأفضل: '+BEST;return overlay('انتهت اللعبة','نقاطك: '+score+'<br>الأفضل: '+BEST,'العب مرة أخرى',start)}
 sn.unshift(h);if(h[0]==food.x&&h[1]==food.y){score+=10;nf();clearInterval(iv);iv=setInterval(step,Math.max(60,130-score/3))}else sn.pop();
 x.clearRect(0,0,W,H);for(var i=0;i<sn.length;i++){x.fillStyle=i?CFG.body:CFG.head;x.beginPath();x.roundRect?x.roundRect(sn[i][0]*G+1,sn[i][1]*G+1,G-2,G-2,5):x.rect(sn[i][0]*G+1,sn[i][1]*G+1,G-2,G-2);x.fill()}
 x.font='16px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(food.e,food.x*G+G/2,food.y*G+G/2+1);document.getElementById('sc').textContent='النقاط: '+score}
overlay(CFG.title,CFG.help,'ابدأ',start);

</script></body></html>
