<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>غرفة الأميرة | خالد البيك</title>
<meta name="description" content="غرفة الأميرة - لعبة مجانية تلعب مباشرة من المتصفح">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#6a1b9a;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px}
h1{font-size:20px;margin:4px 0}
#bar{display:flex;justify-content:space-between;width:100%;font-size:16px;padding:2px 8px;font-weight:bold}
#stage{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;background:rgba(0,0,0,.25);border-radius:12px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;z-index:5}
#ov h2{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0 14px;font-size:16px;line-height:1.5}
button.b{background:#ffcc00;color:#222;border:0;border-radius:24px;padding:12px 32px;font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit}
button.b:active{transform:scale(.95)}
footer{font-size:11px;opacity:.7;padding:4px}
</style></head><body><div id="app">
<h1>🏰 غرفة الأميرة</h1>
<div id="bar"><span id="sc">النقاط: 0</span><span id="lv"></span><span id="bs"></span></div><div id="stage"><canvas id="c" width="360" height="540"></canvas><div id="ov"></div></div>
<footer>© 2026 خالد البيك. جميع الحقوق محفوظة.</footer></div>
<script>
var CFG={"id": "princess-room", "title": "غرفة الأميرة", "emoji": "🏰", "desc": "رتبي غرفة الأحلام", "bg": "#6a1b9a", "bg2": ["#f3e5f5", "#ce93d8"], "stamps": ["🛏️", "🪞", "🧸", "🪑", "🖼️", "🎀", "🦄", "🌙", "💡", "📚"], "smin": 44, "smax": 70, "base": "", "baseSize": 0, "baseY": 0, "help": ""};
var BEST=+(localStorage.getItem('best_'+CFG.id)||0);
function saveBest(s){if(s>BEST){BEST=s;try{localStorage.setItem('best_'+CFG.id,s)}catch(e){}}}
function overlay(t,p,btn,cb){var o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<h2>'+t+'</h2><p>'+p+'</p><button class="b" id="go">'+btn+'</button>';document.getElementById('go').onclick=function(){o.style.display='none';cb()}}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=540,sel=0,items=[],bg=CFG.bg2;
document.getElementById('ov').style.display='none';
var pal=document.createElement('div');pal.style.cssText='display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:100%;padding:4px';
CFG.stamps.forEach(function(s,i){var b=document.createElement('button');b.textContent=s;b.style.cssText='font-size:26px;background:#fff3;border:2px solid transparent;border-radius:10px;padding:2px 6px;cursor:pointer';b.onclick=function(){sel=i;Array.prototype.forEach.call(pal.children,function(k){k.style.borderColor='transparent'});b.style.borderColor='#ffcc00'};pal.appendChild(b)});
pal.children[0].style.borderColor='#ffcc00';
var tb=document.createElement('div');tb.style.cssText='display:flex;gap:8px;padding:4px';
[['↩️ تراجع',function(){items.pop();draw()}],['🗑️ مسح',function(){items=[];draw()}],['📷 حفظ صورة',function(){var a=document.createElement('a');a.download=CFG.id+'.png';a.href=cv.toDataURL();a.click()}]].forEach(function(p){var b=document.createElement('button');b.className='b';b.style.cssText+='font-size:14px;padding:8px 14px';b.textContent=p[0];b.onclick=p[1];tb.appendChild(b)});
document.getElementById('app').insertBefore(pal,document.getElementById('app').children[2]);document.getElementById('app').insertBefore(tb,document.getElementById('app').children[4]);
function draw(){x.clearRect(0,0,W,H);var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,bg[0]);g.addColorStop(1,bg[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
 if(CFG.base){x.textAlign='center';x.textBaseline='middle';x.font=CFG.baseSize+'px serif';x.fillText(CFG.base,W/2,CFG.baseY)}
 x.textAlign='center';x.textBaseline='middle';items.forEach(function(it){x.font=it.s+'px serif';x.fillText(it.e,it.x,it.y)});document.getElementById('sc').textContent='العناصر: '+items.length}
function put(e){var r=cv.getBoundingClientRect();var p=e.touches?e.touches[0]:e;items.push({e:CFG.stamps[sel],x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H,s:rnd(CFG.smin,CFG.smax)});draw()}
cv.addEventListener('mousedown',function(e){put(e)});cv.addEventListener('touchstart',function(e){e.preventDefault();put(e)},{passive:false});
draw();

</script></body></html>
