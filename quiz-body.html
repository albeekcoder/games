<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>جسم الإنسان | خالد البيك</title>
<meta name="description" content="جسم الإنسان - لعبة مجانية تلعب مباشرة من المتصفح">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#c62828;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:6px}
h1{font-size:20px;margin:4px 0}
#bar{display:flex;justify-content:space-between;width:100%;font-size:16px;padding:2px 8px;font-weight:bold}
#stage{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;background:rgba(0,0,0,.25);border-radius:12px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;z-index:5}
#ov h2{margin:0 0 8px;font-size:26px}#ov p{margin:4px 0 14px;font-size:16px;line-height:1.5}
button.b{background:#ffcc00;color:#222;border:0;border-radius:24px;padding:12px 32px;font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit}
button.b:active{transform:scale(.95)}
footer{font-size:11px;opacity:.7;padding:4px}
</style></head><body><div id="app">
<h1>🫀 جسم الإنسان</h1>
<div id="bar"><span id="sc">النقاط: 0</span><span id="lv"></span><span id="bs"></span></div><div id="stage"><div id="ov"></div><div id="field" style="position:absolute;inset:0"></div></div>
<footer>© 2026 خالد البيك. جميع الحقوق محفوظة.</footer></div>
<script>
var CFG={"id": "quiz-body", "title": "جسم الإنسان", "emoji": "🫀", "desc": "تعلّم عن جسمك", "q": [["كم عدد أصابع اليد الواحدة؟", ["4", "5", "6"], 1], ["أي عضو نفكر به؟", ["القلب", "الدماغ", "المعدة"], 1], ["بماذا نرى؟", ["الأذن", "العين", "الأنف"], 1], ["بماذا نشم؟", ["الأنف", "اللسان", "اليد"], 0], ["أي عضو نتنفس به؟", ["الرئتان", "الكبد", "الكلية"], 0], ["كم عدد أسنان الطفل الكبير تقريباً بعد النمو؟", ["20", "32", "50"], 1], ["أي مادة تقوي العظام؟", ["الكالسيوم", "السكر", "الملح"], 0], ["أين يوجد أصغر عظم في الجسم؟", ["الأذن", "الرجل", "اليد"], 0], ["ماذا نفعل لننظف أسناننا؟", ["نغسلها بالفرشاة", "نأكل حلوى", "ننام"], 0], ["كم ساعة نوم تقريباً يحتاج الطفل؟", ["4", "9-11", "15"], 1]], "bg": "#c62828", "help": "أجب عن 10 أسئلة واحصل على أعلى نتيجة."};
var BEST=+(localStorage.getItem('best_'+CFG.id)||0);
function saveBest(s){if(s>BEST){BEST=s;try{localStorage.setItem('best_'+CFG.id,s)}catch(e){}}}
function overlay(t,p,btn,cb){var o=document.getElementById('ov');o.style.display='flex';o.innerHTML='<h2>'+t+'</h2><p>'+p+'</p><button class="b" id="go">'+btn+'</button>';document.getElementById('go').onclick=function(){o.style.display='none';cb()}}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var f=document.getElementById('field'),qs,i,score,N=10;
document.getElementById('bs').textContent='الأفضل: '+BEST;
function start(){qs=shuffle(CFG.q).slice(0,N);i=0;score=0;show()}
function show(){if(i>=qs.length){saveBest(score);document.getElementById('bs').textContent='الأفضل: '+BEST;return overlay('النتيجة: '+score+' / '+qs.length,score>=qs.length*.8?'ممتاز! 🌟':score>=qs.length*.5?'جيد، حاول مرة أخرى لنتيجة أفضل':'استمر بالتدريب 💪','العب مرة أخرى',start)}
 var q=qs[i];f.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:12px;gap:10px';
 f.innerHTML='<div style="text-align:center;font-size:13px;opacity:.8">سؤال '+(i+1)+' من '+qs.length+'</div><div style="font-size:22px;text-align:center;font-weight:bold;margin:6px 0 10px;line-height:1.5">'+q[0]+'</div>';
 var idx=shuffle([0,1,2,3].slice(0,q[1].length));idx.forEach(function(k){var b=document.createElement('button');b.className='b';b.style.cssText='background:#fff;font-size:18px;padding:12px;border-radius:14px';b.textContent=q[1][k];
  b.onclick=function(){var ok=k===q[2];if(ok)score++;Array.prototype.forEach.call(f.querySelectorAll('button'),function(x){x.disabled=true;if(x.textContent===q[1][q[2]])x.style.background='#4caf50';});if(!ok)b.style.background='#e53935';b.style.color=ok?'#fff':'#fff';document.getElementById('sc').textContent='النقاط: '+score;setTimeout(function(){i++;show()},900)};f.appendChild(b)})}
overlay(CFG.title,CFG.help,'ابدأ',start);

</script></body></html>
